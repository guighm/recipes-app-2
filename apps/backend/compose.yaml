# Backend: API (NestJS) + Postgres de dev + Postgres efêmero de e2e.
# Auto-suficiente para desenvolvimento do backend: pode ser executado a partir
# deste diretório. O serviço `frontend` NÃO é declarado aqui (fica em
# apps/frontend/compose.yaml, única declaração dele) — este arquivo é incluído
# pelo compose.yaml da raiz do monorepo, que é o ponto de entrada da stack
# completa: ele adiciona o frontend e conecta tudo (rede + depends_on).
#
# Variáveis vêm do .env (veja .env.example) ou do ambiente do shell:
#   DB_USERNAME, DB_PASSWORD (obrigatórias), PORT, ALLOWED_ORIGIN,
#   JWT_SECRET, JWT_EXPIRATION_MS, JWT_ISSUER.
#   (VITE_API_URL só é usado pelo compose do frontend.)
#
# Nomes dos serviços refletem a tecnologia, não a posição na stack: quando um
# só compose define backend e bancos, `postgres` comunica mais que `db` — e o
# hostname `postgres` da rede Docker aparece em DATABASE_URL.

# Nome fixo do projeto: evita que containers/volumes dependam do nome da pasta
# (e do Compose) de onde o comando é executado.
name: recipes_app_2

networks:
  recipes_app:

volumes:
  recipes_app_data: {}
  # Uploads servidos em /uploads pelo main.ts. O volume herda a ownership
  # (node:node) do diretório criado no Dockerfile.
  recipes_app_uploads: {}

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: recipes_app_2_backend
    # Volta sozinho após queda do daemon ou reboot do host (a menos que seja
    # parado explicitamente com `docker compose stop/down`)
    restart: unless-stopped
    # Hardening: impede escalada de privilégios dentro do container. Custo
    # zero — a imagem já roda como usuário `node`.
    security_opt:
      - no-new-privileges:true
    # Em runtime nada escreve fora de /app/uploads (volume) e /tmp: uploads
    # e código são read-only, sobrevivem intactos a um restart do container
    read_only: true
    tmpfs:
      - /tmp
    # `node` como PID 1 não repassa SIGTERM ao app de forma confiável; o init
    # do Docker faz o papel de PID 1 e encerra o app graciosamente no stop
    init: true
    ports:
      - '3000:3000'
    environment:
      # `postgres` é o hostname do serviço de banco na rede Docker
      DATABASE_URL: postgres://${DB_USERNAME:?DB_USERNAME is required}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/recipes_app
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PORT: ${PORT:-3000}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-72000000}
      JWT_ISSUER: ${JWT_ISSUER:-recipes-app-api}
    volumes:
      # Sem isso, uploads somem a cada recriação do container
      - recipes_app_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recipes_app

  postgres:
    image: postgres:17
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: recipes_app
    volumes:
      - recipes_app_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-root} -d recipes_app' ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - recipes_app

  # Postgres efêmero (tmpfs) para testes e2e — vitest.config.e2e.ts aponta para
  # a porta 5433. Dados vivem só em memória; `docker compose up -d --wait
  # postgres-test` basta para rodar `pnpm test:e2e` (o --wait usa o healthcheck
  # abaixo e espera o Postgres aceitar conexões de verdade). O profile `test`
  # o exclui da stack da aplicação — subir a stack não sobe o banco de teste,
  # e o compose targetado ao serviço o ativa automaticamente.
  postgres-test:
    image: postgres:17
    profiles:
      - test
    security_opt:
      - no-new-privileges:true
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: recipes_app_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U root -d recipes_app_test' ]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - recipes_app
