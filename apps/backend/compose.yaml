# Stack completa: frontend (nginx) + API (NestJS) + Postgres de dev + Postgres
# efêmero de e2e. Este é o ponto de entrada único da stack — substitui o antigo
# docker-compose.yaml.
#
# Variáveis vêm do .env (veja .env.example) ou do ambiente do shell:
#   DB_USERNAME, DB_PASSWORD (obrigatórias), PORT, ALLOWED_ORIGIN,
#   JWT_SECRET, JWT_EXPIRATION_MS, JWT_ISSUER, VITE_API_URL.

# Nome fixo do projeto: evita que containers/volumes dependam do nome da pasta
# (e do Compose) de onde o comando é executado.
name: recipes_app_2

networks:
  recipes_app:

volumes:
  recipes_app_data: {}
  # Uploads servidos em /uploads pelo main.ts. O volume herda a ownership
  # (node:node) do diretório criado no Dockerfile.
  recipes_app_uploads: {}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: recipes_app_2
    # Volta sozinho após queda do daemon ou reboot do host (a menos que seja
    # parado explicitamente com `docker compose stop/down`)
    restart: unless-stopped
    # Hardening: impede escalada de privilégios dentro do container. Custo
    # zero — a imagem já roda como usuário `node`.
    security_opt:
      - no-new-privileges:true
    # Em runtime nada escreve fora de /app/uploads (volume) e /tmp: uploads
    # e código são read-only, sobrevivem intactos a um restart do container
    read_only: true
    tmpfs:
      - /tmp
    # `node` como PID 1 não repassa SIGTERM ao app de forma confiável; o init
    # do Docker faz o papel de PID 1 e encerra o app graciosamente no stop
    init: true
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://${DB_USERNAME:?DB_USERNAME is required}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/recipes_app
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PORT: ${PORT:-3000}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-72000000}
      JWT_ISSUER: ${JWT_ISSUER:-recipes-app-api}
    volumes:
      # Sem isso, uploads somem a cada recriação do container
      - recipes_app_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - recipes_app

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # VITE_API_URL é embutido no bundle em tempo de build (ver Dockerfile):
        # deve ser a URL visível ao navegador do host, não um hostname interno
        # de rede Docker.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    image: recipes_app_2_frontend
    restart: unless-stopped
    # Hardening: impede escalada de privilégios dentro do container. Custo
    # zero — a imagem nginx-unprivileged já roda como usuário comum (uid 101)
    security_opt:
      - no-new-privileges:true
    # nginx-unprivileged escuta em 8080 (nginx.conf do frontend), não em 80
    ports:
      - '5173:8080'
    depends_on:
      # A imagem da API já tem HEALTHCHECK em /health; só sobe o nginx
      # quando a API de fato responde, não apenas quando o container existe
      app:
        condition: service_healthy
    networks:
      - recipes_app

  db:
    image: postgres:17
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: recipes_app
    volumes:
      - recipes_app_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-root} -d recipes_app' ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - recipes_app

  # Postgres efêmero (tmpfs) para testes e2e — vitest.config.e2e.ts aponta para
  # a porta 5433. Dados vivem só em memória; `docker compose up -d --wait
  # db-test` basta para rodar `pnpm test:e2e` (o --wait usa o healthcheck
  # abaixo e espera o Postgres aceitar conexões de verdade).
  db-test:
    image: postgres:17
    security_opt:
      - no-new-privileges:true
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: recipes_app_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U root -d recipes_app_test' ]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - recipes_app
